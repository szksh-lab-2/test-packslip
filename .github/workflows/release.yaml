on:
  push:
    tags:
      - 'v*'
jobs:
  release-reusable-worklfow:
    uses: szksh-lab-2/test-packslip-workflow/.github/workflows/release.yaml@main
    permissions:
      contents: write
      id-token: write      # Sign with the workflow's identity.
      attestations: write  # Attest the downloaded files.

  release:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    if: false
    permissions:
      contents: write
      id-token: write      # Sign with the workflow's identity.
      attestations: write  # Attest the downloaded files.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: flatt-security/setup-takumi-guard-golang@02545d3425218766aac4dca114dcc3f6eaa0df4a # v1.3.0
        with:
          bot-id: ${{secrets.TAKUMI_GUARD_BOT_ID}}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - uses: aquaproj/aqua-installer@96a9bc20066c5bf5e275b41019cfc165b25f4e2e # v4.0.5
        with:
          aqua_version: v2.60.0
      - run: goreleaser --version
        env:
          AQUA_GITHUB_TOKEN: ${{ github.token }}
      - run: packslip --version
        env:
          AQUA_GITHUB_TOKEN: ${{ github.token }}
      - run: goreleaser release --skip publish --clean
      - run: |
          packslip create \
            --project "github.com/${GITHUB_REPOSITORY}" \
            --version "${GITHUB_REF_NAME#v}" \
            --bin hello \
            --out dist \
            dist/*.tar.gz
      - run: packslip show dist/packslip.sigstore.json
      - run: |
          packslip verify dist/packslip.sigstore.json \
            --artifact dist/hello_linux_amd64.tar.gz
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create \
            "${GITHUB_REF_NAME}" \
            dist/*.tar.gz dist/packslip.sigstore.json
